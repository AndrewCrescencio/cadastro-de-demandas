services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-demandas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-demandas}
      POSTGRES_DB: ${DB_NAME:-demandas}
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-demandas} -d ${DB_NAME:-demandas}']
      interval: 5s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      - demandas_network

volumes:
  pgdata:

networks:
  demandas_network:
